name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build
        run: go build ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec
        run: gosec -confidence=high -severity=high ./...

  deploy:
    needs: [build, gosec]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Install Go if not present
            if ! command -v go &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y golang-go
            fi
            cd /home/carlos/cloudmonitor-app
            git pull origin main
            go build -o /home/carlos/cloudmonitor-app/bin/monitor ./cmd/monitor
            sudo systemctl restart cloudmonitor

      - name: Deploy auto-heal script and setup cron
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Copy auto-heal script from project to scripts directory
            mkdir -p /home/carlos/scripts
            cp /home/carlos/cloudmonitor-app/scripts/auto-heal.sh /home/carlos/scripts/auto-heal.sh
            chmod +x /home/carlos/scripts/auto-heal.sh

            # Add sudoers rule for docker (allow carlos to run docker without password)
            echo "carlos ALL=(ALL) NOPASSWD: /usr/bin/docker, /usr/local/bin/docker, /usr/bin/docker-compose, /usr/local/bin/docker-compose, /usr/bin/docker compose, /usr/local/bin/docker compose" | sudo tee /etc/sudoers.d/carlos-docker > /dev/null
            sudo chmod 440 /etc/sudoers.d/carlos-docker

            # Setup cron job for auto-heal (every 2 minutes)
            # Use crontab for user 'carlos'
            (crontab -l 2>/dev/null | grep -v "auto-heal.sh"; echo "*/2 * * * * /home/carlos/scripts/auto-heal.sh") | crontab -

            # Verify cron was added
            crontab -l | grep auto-heal.sh